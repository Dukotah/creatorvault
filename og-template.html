<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CreatorVault — social card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{margin:0}
  /* Render this at exactly 1200×630 and screenshot to og-image.png */
  .card{
    width:1200px;height:630px;position:relative;overflow:hidden;
    background:#faf8f4;color:#14181f;
    font-family:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
    padding:74px 86px;display:flex;flex-direction:column;justify-content:space-between;
  }
  .ring{position:absolute;width:560px;height:560px;border:70px solid #f6ebe2;border-radius:50%;right:-200px;top:-170px;opacity:.85}
  .ring-2{position:absolute;width:300px;height:300px;border:42px solid #e3eeef;border-radius:50%;right:120px;bottom:-150px;opacity:.7}
  .top,.tagline,.foot{position:relative;z-index:1}

  .brand{display:flex;align-items:center;gap:18px}
  .mark{width:66px;height:66px;flex:0 0 auto}
  .wordmark{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:46px;letter-spacing:-.02em}

  .eyebrow{margin-top:50px;color:#8f4a22;font-weight:700;font-size:21px;letter-spacing:.12em;text-transform:uppercase}
  .tagline{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:62px;line-height:1.07;letter-spacing:-.015em;max-width:20ch;margin-top:16px}
  .tagline .hl{color:#bf6b3c}
  .browser{display:inline-flex;align-items:center;gap:14px;margin-top:28px;background:#e3eeef;color:#13525a;font-weight:700;font-size:23px;padding:12px 22px;border-radius:999px}
  .dot{width:13px;height:13px;border-radius:50%;background:#2f7d52;box-shadow:0 0 0 5px rgba(47,125,82,.18)}

  .foot{display:flex;align-items:center;justify-content:space-between}
  .foot .made{color:#665f54;font-size:24px;font-weight:600}
  .foot .made b{color:#14181f;font-weight:700}
  .chips{display:flex;gap:12px}
  .chip{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:19px;font-weight:700;padding:8px 16px;border-radius:8px;background:#f6ebe2;color:#8f4a22}
  .chip.bay{background:#e3eeef;color:#13525a}
</style>
</head>
<body>
  <div class="card">
    <div class="ring"></div>
    <div class="ring-2"></div>

    <div class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="8" y="8" width="48" height="48" rx="12" fill="#bf6b3c"/>
          <rect x="14" y="14" width="36" height="36" rx="8" fill="#14181f"/>
          <circle cx="27" cy="27" r="7" fill="none" stroke="#faf8f4" stroke-width="4"/>
          <path d="M31.8 31.8 41 41" stroke="#faf8f4" stroke-width="4" stroke-linecap="round"/>
          <path d="M41 41 41 46 M37 37 37 41" stroke="#faf8f4" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <span class="wordmark">CreatorVault</span>
      </div>
      <p class="eyebrow">Tools for digital-product creators</p>
      <h1 class="tagline">Generate <span class="hl">license keys</span>. See what your platform really costs you.</h1>
      <span class="browser"><span class="dot"></span>Free &middot; 100% in your browser</span>
    </div>

    <div class="foot">
      <p class="made">A <b>Copper Bay Labs</b> product</p>
      <div class="chips">
        <span class="chip">PRO-7K4QH-2M9XR</span>
        <span class="chip bay">2% + $0.30</span>
      </div>
    </div>
  </div>
</body>
</html>
